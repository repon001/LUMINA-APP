name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Nothing here connects to a database: `prisma generate` only needs the
      # variable to exist, and the tests set their own.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_placeholder
      JWT_REFRESH_SECRET: ci_refresh_secret_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
